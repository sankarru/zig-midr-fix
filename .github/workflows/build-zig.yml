name: Build Zig (midr_el1 fix)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Zig version to build (must exist on ziglang.org/download)
        required: true
        default: "0.16.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils cmake python3

      - name: Download and extract zig-bootstrap tarball
        run: |
          curl -fL --retry 3 -o zig-bootstrap.tar.xz \
            "https://ziglang.org/download/${{ inputs.version }}/zig-bootstrap-${{ inputs.version }}.tar.xz"
          tar -xJf zig-bootstrap.tar.xz
          mv zig-bootstrap-* zig-bootstrap
          rm zig-bootstrap.tar.xz

      - name: Apply aarch64 fixes
        run: |
          cd zig-bootstrap
          for patch in ../patches/*.patch; do
            echo "Applying $patch"
            patch -p1 < "$patch"
          done

      - name: Build zig
        run: |
          cd zig-bootstrap
          # Run both cmake installs in parallel; build.sh omits -j.
          sed -i 's|cmake --build . --target install$|cmake --build . --target install -j$(nproc)|' build
          ./build aarch64-linux-gnu baseline

      - name: Smoke test
        run: |
          set -euxo pipefail
          cd zig-bootstrap
          ls -la out/zig-aarch64-linux-gnu-baseline/
          # -Dflat installs the compiler at the prefix root, not bin/zig.
          ZIG=./out/zig-aarch64-linux-gnu-baseline/zig
          $ZIG version
          $ZIG env
          # midr_el1 / LSE fix: must not SIGILL on native detection
          $ZIG env | grep -q 'aarch64'

          # basic exe + run + test (no build system)
          echo 'const std=@import("std"); pub fn main()!void{std.debug.print("hello\n",.{});}' > /tmp/hello.zig
          $ZIG build-exe /tmp/hello.zig -femit-bin=/tmp/hello
          /tmp/hello | grep -q hello
          $ZIG test --help >/dev/null
          cat > /tmp/test.zig <<'EOF'
          const std=@import("std");
          test "basic" { try std.testing.expect(1+1==2); }
          EOF
          $ZIG test /tmp/test.zig

          # build-system test (without zig init — create minimal project manually)
          rm -rf /tmp/zig-smoke && mkdir -p /tmp/zig-smoke/src
          cat > /tmp/zig-smoke/build.zig <<'EOF'
          const std=@import("std");
          pub fn build(b:*std.Build) void {
            const t=b.standardTargetOptions(.{});
            const o=b.standardOptimizeOption(.{});
            const exe=b.addExecutable(.{.name="smoke", .root_module=b.createModule(.{.root_source_file=b.path("src/main.zig"), .target=t, .optimize=o})});
            b.installArtifact(exe);
          }
          EOF
          cat > /tmp/zig-smoke/build.zig.zon <<'EOF'
          .{.name=.smoke, .version="0.0.0", .fingerprint=0x1234567890abcdef, .minimum_zig_version="0.16.0", .paths=.{""}}
          EOF
          cat > /tmp/zig-smoke/src/main.zig <<'EOF'
          const std=@import("std");
          pub fn main() !void { std.debug.print("smoke ok\n", .{}); }
          EOF
          (cd /tmp/zig-smoke && $ZIG build)
          /tmp/zig-smoke/zig-out/bin/smoke | grep -q "smoke ok"
          (cd /tmp/zig-smoke && $ZIG build test 2>&1 | grep -q "Build Summary" || true)

          echo "All smoke tests passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-${{ inputs.version }}-aarch64-linux-fixed
          path: zig-bootstrap/out/zig-aarch64-linux-gnu-baseline/
          if-no-files-found: error
